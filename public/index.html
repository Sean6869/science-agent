<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小科｜虚拟科学探究平台</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" href="/assets/xiaoke-icon-transparent.png">
</head>
<body>
<main class="app">
<section class="layout">
<article class="experiment">
<div class="panel-head">
<div>
<span class="kicker">实验空间</span>
<img class="brand-logo" src="/assets/xiaoke-logo-transparent.png" alt="小科">
</div>
<a id="openLab" target="_blank" rel="noopener">新页面打开 ↗</a>
</div>
<div class="frame">
<div id="loading">正在连接 NOBOOK 实验…</div>
<iframe id="lab" title="NOBOOK 凸透镜实验">
</iframe>
</div>
</article>
<aside class="coach">
<section class="inquiry">

<nav id="stages" aria-label="探究阶段">
</nav>
<div class="brief" id="brief">
</div>
<div class="stage-meta">
<span id="stageStatus">
</span>
<button id="clear" class="link">清空本次记录</button>
</div>
<div id="messages" class="messages" aria-live="polite">
</div>
<div id="assessment" class="assessment" hidden>
</div>
<form id="composer">
<div class="input-row">
<textarea id="draft" rows="2" aria-label="本阶段产出" placeholder="输入小组的科学推理产出…"></textarea>
<div class="composer-actions">
<button type="button" id="voice" class="icon-button voice" aria-label="语音输入" title="语音输入">
<svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M9 21h6"/></svg>
<svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
</button>
<button type="submit" class="icon-button send primary" aria-label="提交产出" title="提交产出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
</div>
</div>
<small id="voiceState"></small>
</form>
</section>
</aside>
</section>
</main>
<script type="module" src="/app.js">
</script>
</body>
</html>
