<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小科｜虚拟科学探究平台</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/school.css">
<link rel="icon" type="image/png" href="/assets/xiaoke-icon-transparent.png?v=20260917">
<link rel="preconnect" href="https://phet.colorado.edu" crossorigin>
<link rel="preload" as="image" href="/assets/xiaoke-pet-active.png?v=20260917">
<link rel="preload" as="image" href="/assets/lesson-1.png?v=20260917">
<link rel="preload" as="image" href="/assets/lesson-2.png?v=20260917">
<link rel="preload" as="image" href="/assets/lesson-3.png?v=20260917">
</head>
<body>
<main id="schoolScreen" aria-live="polite"><p>正在连接小科…</p></main>
<main class="app" hidden>
<section class="layout">
<article class="experiment">
<div class="panel-head">
<div>
<img class="brand-logo" src="/assets/xiaoke-logo-transparent.png?v=20260917" alt="小科">
</div>
<nav id="lessonSelector" class="lesson-selector" aria-label="选择实验课程"><button id="previousLesson" type="button" aria-label="上一节课"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M6 13h13V7q0-3 3-1l10 9q3 3 0 6l-10 9q-3 2-3-1v-6H6q-3 0-3-3v-4q0-3 3-3Z" fill="#7dd9f4" stroke="#166da8" stroke-width="2.8" stroke-linejoin="round"/><path d="M7 16h14" fill="none" stroke="#e8fbff" stroke-width="2.4" stroke-linecap="round"/></svg></button><span id="lessonLabel" aria-live="polite"><img id="lessonArtwork" src="/assets/lesson-1.png?v=20260917" alt="第一节课"></span><button id="nextLesson" type="button" aria-label="下一节课"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M6 13h13V7q0-3 3-1l10 9q3 3 0 6l-10 9q-3 2-3-1v-6H6q-3 0-3-3v-4q0-3 3-3Z" fill="#7dd9f4" stroke="#166da8" stroke-width="2.8" stroke-linejoin="round"/><path d="M7 16h14" fill="none" stroke="#e8fbff" stroke-width="2.4" stroke-linecap="round"/></svg></button></nav>
<div class="workspace-actions"><button id="coachToggle" type="button" aria-controls="coachPanel" aria-expanded="true" aria-label="收起探究支架"><img src="/assets/coach-toggle.png?v=20260917" alt=""><span aria-hidden="true">›</span></button></div>
</div>
<div class="frame">
<div id="loading">正在加载实验课程…</div>
<iframe id="lab" title="PhET 科学实验" allow="fullscreen">
</iframe>
</div>
</article>
<aside class="coach" id="coachPanel" aria-label="元认知支架">
<section class="inquiry">

<section class="stage-progress">
<nav id="stages" aria-label="探究阶段">
</nav>
<div class="timer-toolbar">
<div id="stageTimer" class="stage-timer" data-state="idle" aria-live="polite">
<svg class="alarm-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3 3 7m14-4 4 4M5 13a7 7 0 1 1 14 0c0 2.2-1 4.2-2.6 5.5L18 21M6 21l1.6-2.5M12 9v4l2.5 1.5"/></svg>
<span id="timerLabel">第 1 环节</span>
<strong id="timerRemaining">05:00</strong>
<span id="timerHint">点击环节开始</span>
<button id="timerToggle" type="button" class="icon-button timer-control" aria-label="开始倒计时" title="开始倒计时">
<svg class="timer-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6V6Z"/></svg>
<svg class="timer-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
</button>
<button id="timerReset" type="button" class="link timer-reset">重置</button>
</div>
<button id="timerSettingsToggle" type="button" class="timer-settings-toggle" aria-expanded="false" aria-controls="timerSettingsPanel">设置各环节时间⌄</button>
</div>
<form id="timerSettingsPanel" class="timer-settings-panel" hidden>
<div id="timerFields" class="timer-fields"></div>
<div class="timer-settings-actions">
<span>保存后将按新时长重置全部倒计时</span>
<button type="submit" class="primary">保存时间设置</button>
</div>
</form>
</section>
<div class="brief" id="brief">
<button id="narrate" type="button" class="icon-button brief-narrate" aria-label="播放开场白" title="播放开场白">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5l4.5 4V5Zm4 4a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11"/></svg>
</button>
</div>
<div class="stage-meta">
<span id="stageStatus">
</span>
<button id="clear" class="link">清空本次记录</button>
</div>
<div id="messages" class="messages" aria-live="polite">
</div>
<div id="assessment" class="assessment" hidden>
</div>
<form id="composer">
<div class="input-row">
<textarea id="draft" rows="2" aria-label="本阶段产出" placeholder="输入小组的科学推理产出…（Enter 发送，Shift+Enter 换行）"></textarea>
<div class="composer-actions">
<button type="button" id="voice" class="icon-button voice" aria-label="语音输入" title="语音输入">
<svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3M9 21h6"/></svg>
<svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
</button>
<button type="submit" class="icon-button send primary" aria-label="提交产出" title="提交产出"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
</div>
</div>
<small id="voiceState"></small>
</form>
</section>
</aside>
</section>
</main>
<button id="knowledgeToggle" class="knowledge-pet" type="button" aria-label="打开知识答疑" aria-expanded="false" aria-controls="knowledgePanel" title="点击答疑，拖动移动"><img id="petFace" src="/assets/xiaoke-icon-transparent.png?v=20260917" alt="小科知识宠物" draggable="false"></button>
<section id="knowledgePanel" class="knowledge-panel" role="dialog" aria-modal="false" aria-labelledby="knowledgeTitle" hidden>
<header class="knowledge-header"><div><strong id="knowledgeTitle">小科 · 知识答疑</strong><small>科学概念基础知识</small></div><button id="knowledgeClose" type="button" aria-label="收起知识答疑">×</button></header>
<div id="knowledgeMessages" class="knowledge-messages" role="log" aria-live="polite"></div>
<details class="knowledge-prompts"><summary>本课典型问题</summary><div id="knowledgePromptList" class="knowledge-prompt-list"></div></details>
<form id="knowledgeComposer" class="chat-composer"><textarea id="knowledgeDraft" aria-label="知识问题" placeholder="例如：实像和虚像有什么区别？" maxlength="2000" rows="2"></textarea><div class="composer-actions"><button class="icon-button primary" id="knowledgeSend" type="submit" aria-label="发送知识问题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div></form>
</section>
<script type="module" src="/school.js">
</script>
</body>
</html>
